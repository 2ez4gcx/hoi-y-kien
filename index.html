<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Hỏi Ý Kiến 💘</title>
<meta property="og:title" content="Có người muốn hỏi ý kiến bạn nè 💌">
<meta property="og:description" content="Mở ra xem đi, chỉ mất 5 giây thôi...">
<meta property="og:type" content="website">
<meta property="og:url" content="https://2ez2ask.pages.dev/">
<meta property="og:image" content="https://2ez2ask.pages.dev/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Có người muốn hỏi ý kiến bạn nè 💌">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://2ez2ask.pages.dev/og.png">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --pink: #ff5c8a;
    --pink-dark: #e63e6d;
    --bg1: #ffe3ec;
    --bg2: #ffd6e8;
  }

  html, body { height: 100%; }

  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: linear-gradient(160deg, var(--bg1), var(--bg2) 60%, #ffc9de);
    overflow: hidden;
    color: #4a2032;
  }

  .screen {
    position: fixed;
    inset: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    text-align: center;
  }
  .screen.active { display: flex; }

  .card {
    background: rgba(255,255,255,.9);
    backdrop-filter: blur(6px);
    border-radius: 24px;
    padding: 36px 28px;
    max-width: 440px;
    width: 100%;
    box-shadow: 0 20px 60px rgba(230,62,109,.25);
  }

  h1 { font-size: 1.5rem; margin-bottom: 8px; }
  .sub { color: #a3607c; font-size: .95rem; margin-bottom: 20px; }

  textarea {
    width: 100%;
    min-height: 90px;
    border: 2px solid #ffb3cd;
    border-radius: 14px;
    padding: 12px 14px;
    font-size: 1rem;
    font-family: inherit;
    resize: vertical;
    outline: none;
    color: inherit;
  }
  textarea:focus { border-color: var(--pink); }

  .lang-row { display: flex; gap: 8px; justify-content: center; margin-bottom: 14px; }
  .lang-btn {
    border: 2px solid #ffb3cd;
    background: #fff;
    border-radius: 999px;
    padding: 6px 14px;
    cursor: pointer;
    font-family: inherit;
    font-size: .9rem;
    color: #a3607c;
  }
  .lang-btn.active {
    background: linear-gradient(135deg, var(--pink), var(--pink-dark));
    color: #fff;
    border-color: transparent;
  }

  .preset-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; justify-content: center; }
  .preset-chip {
    border: 1.5px solid #ffb3cd;
    background: #fff0f5;
    color: #a3607c;
    border-radius: 999px;
    padding: 5px 10px;
    font-size: .78rem;
    cursor: pointer;
    font-family: inherit;
  }
  .preset-chip:hover { border-color: var(--pink); color: var(--pink-dark); }

  .btn {
    display: inline-block;
    border: none;
    border-radius: 999px;
    padding: 14px 30px;
    font-size: 1.05rem;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    transition: transform .12s ease, box-shadow .12s ease;
  }
  .btn:active { transform: scale(.96); }

  .btn-primary {
    background: linear-gradient(135deg, var(--pink), var(--pink-dark));
    color: #fff;
    box-shadow: 0 8px 24px rgba(230,62,109,.4);
    margin-top: 16px;
  }
  .btn-primary:hover { box-shadow: 0 10px 30px rgba(230,62,109,.55); }

  .link-box {
    display: none;
    margin-top: 20px;
    text-align: left;
  }
  .link-box.show { display: block; }
  .link-url {
    background: #fff0f5;
    border: 2px dashed #ffb3cd;
    border-radius: 12px;
    padding: 10px 12px;
    font-size: .82rem;
    word-break: break-all;
    max-height: 80px;
    overflow: auto;
    margin-bottom: 10px;
  }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  .btn-small {
    flex: 1;
    padding: 10px 16px;
    font-size: .92rem;
    border-radius: 12px;
    background: #fff;
    border: 2px solid var(--pink);
    color: var(--pink-dark);
  }

  /* ===== màn hỏi ===== */
  .question {
    font-size: 1.6rem;
    font-weight: 800;
    line-height: 1.4;
    max-width: 560px;
    margin-bottom: 40px;
    text-wrap: balance;
  }
  .question .emoji { font-size: 2.6rem; display: block; margin-bottom: 12px; animation: bounce 1.4s infinite; }
  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }

  .choices {
    display: flex;
    gap: 22px;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
  }

  #btnYes {
    background: linear-gradient(135deg, #2bd47d, #14b866);
    color: #fff;
    box-shadow: 0 8px 24px rgba(20,184,102,.4);
    font-size: 1.15rem;
    padding: 16px 36px;
  }

  #btnNo {
    background: linear-gradient(135deg, #8a94a6, #5b6472);
    color: #fff;
    box-shadow: 0 8px 24px rgba(91,100,114,.35);
    font-size: 1.15rem;
    padding: 16px 36px;
    position: relative;
    transition: transform .12s;
  }
  #btnNo.fleeing {
    position: fixed;
    z-index: 50;
    margin: 0;
    will-change: left, top;
  }
  #btnNo.chained {
    cursor: not-allowed;
    filter: grayscale(.4) brightness(.85);
  }
  #btnNo.shake { animation: shake .45s; }
  @keyframes shake {
    0%,100% { transform: translateX(0) rotate(0); }
    20% { transform: translateX(-7px) rotate(-3deg); }
    40% { transform: translateX(7px) rotate(3deg); }
    60% { transform: translateX(-5px) rotate(-2deg); }
    80% { transform: translateX(5px) rotate(2deg); }
  }

  /* sợi xích quấn nút */
  .chain-wrap {
    position: absolute;
    inset: -14px -18px;
    pointer-events: none;
    opacity: 0;
    transition: opacity .25s;
  }
  #btnNo.chained .chain-wrap { opacity: 1; }
  .chain {
    position: absolute;
    font-size: 1.5rem;
    letter-spacing: -6px;
    white-space: nowrap;
    text-shadow: 0 2px 4px rgba(0,0,0,.35);
    animation: chainDrop .4s ease-out;
  }
  .chain.c1 { top: 50%; left: -6%; width: 112%; transform: translateY(-50%) rotate(-14deg); }
  .chain.c2 { top: 50%; left: -6%; width: 112%; transform: translateY(-50%) rotate(14deg); }
  .chain .padlock {
    position: absolute;
    left: 50%; top: 50%;
    transform: translate(-50%,-50%);
    font-size: 1.7rem;
    letter-spacing: 0;
  }
  @keyframes chainDrop {
    from { opacity: 0; transform: translateY(-50%) rotate(-14deg) scale(1.6); }
    to   { opacity: 1; }
  }

  .taunt {
    position: fixed;
    bottom: 8vh;
    left: 0; right: 0;
    text-align: center;
    font-size: 1.05rem;
    font-weight: 600;
    color: var(--pink-dark);
    opacity: 0;
    transition: opacity .3s;
    pointer-events: none;
    padding: 0 20px;
  }
  .taunt.show { opacity: 1; }

  /* ===== màn kết quả ===== */
  #screenYes .big { font-size: 4rem; animation: pop .5s cubic-bezier(.2,1.6,.4,1); }
  @keyframes pop { from { transform: scale(0); } to { transform: scale(1); } }
  #screenYes h1 { font-size: 2rem; margin-top: 10px; }

  .heart {
    position: fixed;
    top: -8vh;
    font-size: 1.6rem;
    pointer-events: none;
    animation: fall linear forwards;
    z-index: 99;
  }
  @keyframes fall {
    to { transform: translateY(120vh) rotate(360deg); }
  }

  .credit {
    position: fixed;
    bottom: 10px;
    left: 0; right: 0;
    text-align: center;
    font-size: .78rem;
    color: #c48aa2;
  }
  .credit a { color: inherit; }
</style>
</head>
<body>

<!-- Màn 1: tạo câu hỏi -->
<div class="screen" id="screenCreate">
  <div class="card">
    <h1 id="createTitle">💌 Tạo lời hỏi ý kiến</h1>
    <p class="sub" id="createSub">Nhập điều bạn muốn hỏi, nhận link và gửi cho người ấy. Người ấy sẽ… không có lựa chọn nào khác đâu 😏</p>
    <div class="lang-row">
      <button class="lang-btn active" data-lang="vi" type="button">🇻🇳 Tiếng Việt</button>
      <button class="lang-btn" data-lang="en" type="button">🇬🇧 English</button>
    </div>
    <div class="preset-row" id="presetRow"></div>
    <textarea id="inpQuestion" maxlength="300" placeholder="VD: Làm người yêu anh nhé? 🥺"></textarea>
    <button class="btn btn-primary" id="btnCreate">Tạo link 💘</button>
    <div class="link-box" id="linkBox">
      <div class="link-url" id="linkUrl"></div>
      <div class="row">
        <button class="btn btn-small" id="btnCopy">📋 Copy link</button>
        <button class="btn btn-small" id="btnPreview">👀 Xem thử</button>
      </div>
    </div>
  </div>
  <div class="credit" id="creditText">Trang tĩnh miễn phí — câu hỏi nằm ngay trong link, không lưu ở đâu cả 🔒</div>
</div>

<!-- Màn 2: trả lời -->
<div class="screen" id="screenAsk">
  <div class="question"><span class="emoji">🥺👉👈</span><span id="questionText"></span></div>
  <div class="choices">
    <button class="btn" id="btnYes">Đồng ý 💖</button>
    <button class="btn" id="btnNo">Không đồng ý
      <span class="chain-wrap">
        <span class="chain c1">⛓️⛓️⛓️⛓️⛓️</span>
        <span class="chain c2">⛓️⛓️⛓️⛓️⛓️<span class="padlock">🔒</span></span>
      </span>
    </button>
  </div>
  <div class="taunt" id="taunt"></div>
</div>

<!-- Màn 3: đồng ý -->
<div class="screen" id="screenYes">
  <div>
    <div class="big">🎉💖🎉</div>
    <h1 id="yesTitle">Tuyệt vờiii!</h1>
    <p class="sub" id="yesSub" style="margin-top:8px">Biết ngay là sẽ đồng ý mà 😌<br>Chụp màn hình gửi lại cho người ấy nhé!</p>
  </div>
</div>

<script>
(function () {
  // ---------- mã hoá / giải mã câu hỏi trong URL (hỗ trợ tiếng Việt) ----------
  function enc(str) {
    return btoa(String.fromCharCode(...new TextEncoder().encode(str)))
      .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  }
  function dec(b64) {
    try {
      const s = b64.replace(/-/g, '+').replace(/_/g, '/');
      const bytes = Uint8Array.from(atob(s), c => c.charCodeAt(0));
      return new TextDecoder().decode(bytes);
    } catch (e) { return null; }
  }

  const I18N = {
    vi: {
      createTitle: '💌 Tạo lời hỏi ý kiến',
      createSub: 'Nhập điều bạn muốn hỏi, nhận link và gửi cho người ấy. Người ấy sẽ… không có lựa chọn nào khác đâu 😏',
      placeholder: 'VD: Làm người yêu anh nhé? 🥺',
      createBtn: 'Tạo link 💘',
      copy: '📋 Copy link', copied: '✅ Đã copy!', copyManual: 'Nhấn Ctrl+C để copy',
      preview: '👀 Xem thử',
      credit: 'Trang tĩnh miễn phí — câu hỏi nằm ngay trong link, không lưu ở đâu cả 🔒',
      yes: 'Đồng ý 💖', no: 'Không đồng ý',
      yesTitle: 'Tuyệt vờiii!',
      yesSub: 'Biết ngay là sẽ đồng ý mà 😌<br>Chụp màn hình gửi lại cho người ấy nhé!',
      taunts: [
        'Ơ kìa, đứng yên coi 😆',
        'Bắt được thì cho từ chối 😝',
        'Nút này nhanh lắm đó!',
        'Thôi bấm nút xanh cho lẹ 💚',
        'Đuổi theo chi cho mệt~',
      ],
      chainedTaunts: [
        'Nút này bị xích rồi, không bấm được đâu 🔒',
        'Hết cách rồi, chỉ còn một lựa chọn thôi 😌',
        'Sợi xích này chắc lắm, đừng cố 😆',
      ],
      // KHÔNG đổi thứ tự/nội dung: link dạng ?p=N trỏ theo vị trí trong danh sách này
      presets: [
        'Làm người yêu anh nhé? 🥺',
        'Làm người yêu em nhé? 🥺',
        'Cuối tuần này đi cà phê với anh nhé? ☕',
        'Đi chơi với em cuối tuần này nhé? 🌸',
        'Mình chính thức quen nhau nhé? 💘',
        'Tối nay đi xem phim với anh nhé? 🎬',
      ],
    },
    en: {
      createTitle: '💌 Create your question',
      createSub: "Type what you want to ask, get a link and send it over. They won't really have a choice 😏",
      placeholder: 'e.g. Will you be my valentine? 🥺',
      createBtn: 'Create link 💘',
      copy: '📋 Copy link', copied: '✅ Copied!', copyManual: 'Press Ctrl+C to copy',
      preview: '👀 Preview',
      credit: 'Free static page — the question lives in the link itself, nothing is stored 🔒',
      yes: 'Yes 💖', no: 'No way',
      yesTitle: 'Yayyy!',
      yesSub: 'Knew you would say yes 😌<br>Screenshot this and send it back!',
      taunts: [
        'Hey, hold still! 😆',
        'Catch me if you can 😝',
        'This button is way too fast!',
        'Just hit the green one 💚',
        'Why even bother chasing~',
      ],
      chainedTaunts: [
        'This button is chained now, sorry 🔒',
        "No other options left, I'm afraid 😌",
        "That chain won't break, don't even try 😆",
      ],
      // Do NOT reorder/edit: ?p=N links point into this list by position
      presets: [
        'Will you be my valentine? 🥺',
        'Will you go out with me? 🌹',
        'Coffee with me this weekend? ☕',
        'Movie night with me tonight? 🎬',
        'Can we make it official? 💘',
        'Dinner with me this Friday? 🍝',
      ],
    },
  };

  const $ = id => document.getElementById(id);
  const params = new URLSearchParams(location.search);
  let lang = ['vi', 'en'].includes(params.get('l')) ? params.get('l') : 'vi';
  let q = params.get('q') ? dec(params.get('q')) : null;
  // link rút gọn ?p=N -> lấy câu mẫu thứ N
  const pNum = parseInt(params.get('p'), 10);
  if (!q && pNum >= 1 && pNum <= I18N[lang].presets.length) q = I18N[lang].presets[pNum - 1];

  // ---------- Màn tạo link ----------
  if (!q) {
    $('screenCreate').classList.add('active');
    let link = '';

    function applyCreateLang() {
      const t = I18N[lang];
      document.documentElement.lang = lang;
      $('createTitle').textContent = t.createTitle;
      $('createSub').textContent = t.createSub;
      $('inpQuestion').placeholder = t.placeholder;
      $('btnCreate').textContent = t.createBtn;
      $('btnCopy').textContent = t.copy;
      $('btnPreview').textContent = t.preview;
      $('creditText').textContent = t.credit;
      // câu hỏi mẫu: chọn mẫu thì link sẽ siêu ngắn (?p=N thay vì mã hoá cả câu)
      $('presetRow').innerHTML = '';
      t.presets.forEach(p => {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'preset-chip';
        b.textContent = p;
        b.addEventListener('click', () => {
          $('inpQuestion').value = p;
          if ($('linkBox').classList.contains('show')) buildLink();
        });
        $('presetRow').appendChild(b);
      });
    }

    function buildLink() {
      const text = $('inpQuestion').value.trim();
      if (!text) { $('inpQuestion').focus(); return; }
      const pi = I18N[lang].presets.indexOf(text);
      const payload = pi >= 0 ? '?p=' + (pi + 1) : '?q=' + enc(text);
      link = location.origin + location.pathname.replace(/index\.html$/, '') + payload + (lang !== 'vi' ? '&l=' + lang : '');
      $('linkUrl').textContent = link;
      $('linkBox').classList.add('show');
    }

    document.querySelectorAll('.lang-btn').forEach(b => {
      b.addEventListener('click', () => {
        lang = b.dataset.lang;
        document.querySelectorAll('.lang-btn').forEach(x => x.classList.toggle('active', x === b));
        applyCreateLang();
        if ($('linkBox').classList.contains('show')) buildLink(); // đã có link -> cập nhật theo ngôn ngữ mới
      });
    });
    applyCreateLang();

    $('btnCreate').addEventListener('click', buildLink);
    $('btnCopy').addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(link);
        $('btnCopy').textContent = I18N[lang].copied;
      } catch (e) {
        // fallback: bôi đen để tự copy
        const r = document.createRange();
        r.selectNodeContents($('linkUrl'));
        const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
        $('btnCopy').textContent = I18N[lang].copyManual;
      }
      setTimeout(() => $('btnCopy').textContent = I18N[lang].copy, 2000);
    });
    $('btnPreview').addEventListener('click', () => { location.href = link; });
    return;
  }

  // ---------- Màn trả lời ----------
  const T = I18N[lang];
  document.documentElement.lang = lang;
  $('screenAsk').classList.add('active');
  $('questionText').textContent = q;

  const btnNo = $('btnNo');
  const btnYes = $('btnYes');
  const taunt = $('taunt');

  btnYes.textContent = T.yes;
  btnNo.firstChild.textContent = T.no + ' '; // chỉ đổi phần chữ, giữ nguyên sợi xích bên trong
  $('yesTitle').textContent = T.yesTitle;
  $('yesSub').innerHTML = T.yesSub;

  const FLEE_DURATION = 3000;   // tổng thời gian BỊ RƯỢT thì mới dừng (không tính lúc được thả)
  const REACT_RADIUS = 150;     // con trỏ cách MÉP nút dưới khoảng này là nút lùi ra xa

  let fleeStart = null;         // đã từng bắt đầu chạy trốn chưa
  let chaseMs = 0;              // thời gian bị rượt đuổi cộng dồn
  let lastT = 0;                // mốc thời gian của frame trước
  let fleeActive = false;       // vòng lặp di chuyển đang chạy
  let chained = false;
  const pos = { x: 0, y: 0 };   // vị trí nút (góc trên trái)
  const mouse = { x: -9999, y: -9999 };
  const imp = { x: 0, y: 0 };   // cú hích khi bị bấm trúng / chạm trên mobile
  const dash = { x: 0, y: 0, until: 0 }; // cú thoát góc: giữ nguyên hướng trong ~0.5s

  const taunts = T.taunts;
  const chainedTaunts = T.chainedTaunts;
  let tauntTimer = null;
  function showTaunt(list) {
    taunt.textContent = list[Math.floor(Math.random() * list.length)];
    taunt.classList.add('show');
    clearTimeout(tauntTimer);
    tauntTimer = setTimeout(() => taunt.classList.remove('show'), 1800);
  }

  function canStillFlee() {
    return !chained && chaseMs < FLEE_DURATION;
  }

  // chuyển nút sang position:fixed ngay tại chỗ đang đứng và khởi động vòng lặp chạy
  function startFlee() {
    if (fleeStart !== null || chained) return;
    fleeStart = Date.now();
    lastT = fleeStart;
    const r = btnNo.getBoundingClientRect();
    pos.x = r.left; pos.y = r.top;
    btnNo.classList.add('fleeing');
    btnNo.style.left = pos.x + 'px';
    btnNo.style.top = pos.y + 'px';
    fleeActive = true;
    schedule();
    showTaunt(taunts);
  }

  // rAF bị trình duyệt tạm dừng khi tab ẩn -> dùng setTimeout thay thế lúc đó
  function schedule() {
    if (document.visibilityState === 'hidden') setTimeout(step, 16);
    else requestAnimationFrame(step);
  }

  // mỗi frame: lùi từ từ khỏi con trỏ, càng bị dí sát chạy càng nhanh
  function step() {
    if (!fleeActive || chained) return;

    const bw = btnNo.offsetWidth, bh = btnNo.offsetHeight;
    const pad = 10;
    const maxX = innerWidth - bw - pad, maxY = innerHeight - bh - pad;
    const cx = pos.x + bw / 2, cy = pos.y + bh / 2;
    let dx = cx - mouse.x, dy = cy - mouse.y;
    let dist = Math.hypot(dx, dy);
    if (dist < 8) { // con trỏ đè ngay giữa nút -> chạy về phía còn trống của màn hình
      dx = cx < innerWidth / 2 ? 1 : -1;
      dy = cy < innerHeight / 2 ? 1 : -1;
      dist = 1;
    }
    // đo theo khoảng cách từ con trỏ đến MÉP nút (nút to, đo theo tâm sẽ bị bám đuôi)
    const ex = Math.max(pos.x - mouse.x, 0, mouse.x - (pos.x + bw));
    const ey = Math.max(pos.y - mouse.y, 0, mouse.y - (pos.y + bh));
    const edge = Math.hypot(ex, ey);

    // 5 giây chỉ đếm lúc ĐANG bị rượt; buông chuột ra là đồng hồ tạm dừng
    const nowT = Date.now();
    const dt = Math.min(50, nowT - lastT);
    lastT = nowT;
    if (edge < REACT_RADIUS) {
      chaseMs += dt;
      if (!canStillFlee()) { fleeActive = false; return; } // đủ 5s bị rượt -> đứng yên chịu trói
    }

    let vx = 0, vy = 0;
    const dashing = Date.now() < dash.until && edge < REACT_RADIUS;
    if (dashing) {
      // đang dash thoát góc: giữ nguyên hướng, không đổi ý giữa chừng
      vx = dash.x; vy = dash.y;
    } else if (edge < REACT_RADIUS) {
      // xa thì đủng đỉnh (~2px/frame), bị dí sát thì vọt lên để không bao giờ bị bắt
      const speed = edge < 40 ? 20 : 2 + (REACT_RADIUS - edge) * 0.09;
      vx = dx / dist * speed;
      vy = dy / dist * speed;
      if (Math.random() < 0.015) showTaunt(taunts);
    }
    vx += imp.x; vy += imp.y;
    imp.x *= 0.85; imp.y *= 0.85;

    let nx = pos.x + vx, ny = pos.y + vy;
    const hitX = nx < pad ? -1 : nx > maxX ? 1 : 0; // đang bị ép vào mép trái/phải
    const hitY = ny < pad ? -1 : ny > maxY ? 1 : 0; // đang bị ép vào mép trên/dưới
    nx = Math.max(pad, Math.min(maxX, nx));
    ny = Math.max(pad, Math.min(maxY, ny));

    if (hitX && hitY && dist < REACT_RADIUS && !dashing) {
      // kẹt góc -> phóng nhanh dọc theo cạnh dài hơn và GIỮ hướng đó nửa giây để thoát hẳn
      if (maxX - pad >= maxY - pad) { vx = -hitX * 18; vy = 0; }
      else { vy = -hitY * 18; vx = 0; }
      dash.x = vx; dash.y = vy; dash.until = Date.now() + 500;
      nx = Math.max(pad, Math.min(maxX, pos.x + vx));
      ny = Math.max(pad, Math.min(maxY, pos.y + vy));
    } else if (hitX && !dashing && dist < REACT_RADIUS) {
      // chạm mép dọc -> dồn hết tốc độ sang chiều còn tự do để trượt dọc mép
      const s = Math.max(Math.abs(vx) + Math.abs(vy), 8);
      vy = (vy !== 0 ? Math.sign(vy) : (mouse.y > cy ? -1 : 1)) * s;
      ny = Math.max(pad, Math.min(maxY, pos.y + vy));
    } else if (hitY && !dashing && dist < REACT_RADIUS) {
      const s = Math.max(Math.abs(vx) + Math.abs(vy), 8);
      vx = (vx !== 0 ? Math.sign(vx) : (mouse.x > cx ? -1 : 1)) * s;
      nx = Math.max(pad, Math.min(maxX, pos.x + vx));
    }
    if (dashing && (hitX || hitY)) dash.until = 0; // dash đâm vào tường -> kết thúc sớm

    // VÙNG CẤM quanh nút Đồng ý: không bao giờ được chạy đè lên đó
    const yr = btnYes.getBoundingClientRect();
    const m = 14;
    const L = yr.left - m - bw, R = yr.right + m, T = yr.top - m - bh, B = yr.bottom + m;
    if (nx > L && nx < R && ny > T && ny < B) {
      // đẩy ra khỏi vùng cấm theo phía gần nhất còn nằm trong màn hình
      const pushes = [
        { axis: 'x', val: L, pen: nx - L, ok: L >= pad },
        { axis: 'x', val: R, pen: R - nx, ok: R <= maxX },
        { axis: 'y', val: T, pen: ny - T, ok: T >= pad },
        { axis: 'y', val: B, pen: B - ny, ok: B <= maxY },
      ].filter(p => p.ok).sort((a, b) => a.pen - b.pen);
      if (pushes.length) {
        const p = pushes[0];
        if (p.axis === 'x') {
          nx = p.val;
          if (edge < REACT_RADIUS && Math.abs(vy) < 4) // trượt dọc mép vùng cấm nếu đang bị dí
            ny = Math.max(pad, Math.min(maxY, pos.y + (mouse.y > cy ? -1 : 1) * Math.max(Math.abs(vx), 8)));
        } else {
          ny = p.val;
          if (edge < REACT_RADIUS && Math.abs(vx) < 4)
            nx = Math.max(pad, Math.min(maxX, pos.x + (mouse.x > cx ? -1 : 1) * Math.max(Math.abs(vy), 8)));
        }
      }
    }

    pos.x = nx; pos.y = ny;
    btnNo.style.left = nx + 'px';
    btnNo.style.top = ny + 'px';
    schedule();
  }

  // Desktop: theo dõi con trỏ; lọt vào vòng phản ứng là nút bắt đầu chạy
  document.addEventListener('mousemove', e => {
    mouse.x = e.clientX; mouse.y = e.clientY;
    if (chained) return;
    if (fleeStart !== null) {
      // nếu đã hết 5s mà loop dừng thì thôi; còn lại loop tự lo
      if (fleeActive === false && canStillFlee()) { fleeActive = true; lastT = Date.now(); schedule(); }
      return;
    }
    const r = btnNo.getBoundingClientRect();
    const ex0 = Math.max(r.left - e.clientX, 0, e.clientX - r.right);
    const ey0 = Math.max(r.top - e.clientY, 0, e.clientY - r.bottom);
    if (Math.hypot(ex0, ey0) < 70) startFlee();
  });

  // Mobile: không có hover nên mỗi lần chạm là một cú hích trượt ra xa
  btnNo.addEventListener('touchstart', e => {
    if (chained) return;
    if (fleeStart === null || canStillFlee()) {
      e.preventDefault();
      const t = e.touches[0];
      mouse.x = t.clientX; mouse.y = t.clientY;
      startFlee();
      const cxT = pos.x + btnNo.offsetWidth / 2 - t.clientX;
      const cyT = pos.y + btnNo.offsetHeight / 2 - t.clientY;
      const d = Math.hypot(cxT, cyT) || 1;
      imp.x = cxT / d * 22; imp.y = cyT / d * 22;
    }
  }, { passive: false });

  function chainUp() {
    chained = true;
    btnNo.classList.add('chained', 'shake');
    setTimeout(() => btnNo.classList.remove('shake'), 500);
    showTaunt(chainedTaunts);
  }

  btnNo.addEventListener('click', e => {
    e.preventDefault();
    if (chained) {
      btnNo.classList.add('shake');
      setTimeout(() => btnNo.classList.remove('shake'), 500);
      showTaunt(chainedTaunts);
      return;
    }
    if (fleeStart === null || canStillFlee()) {
      // lỡ bấm trúng trong 5 giây đầu -> hích nút vọt ra xa, chưa cho khoá
      mouse.x = e.clientX; mouse.y = e.clientY;
      startFlee();
      const cxC = pos.x + btnNo.offsetWidth / 2 - e.clientX;
      const cyC = pos.y + btnNo.offsetHeight / 2 - e.clientY;
      const d = Math.hypot(cxC, cyC) || 1;
      imp.x = cxC / d * 20; imp.y = cyC / d * 20;
      return;
    }
    // đã hết 5 giây, đứng yên và bị bấm -> khoá xích
    chainUp();
  });

  // ---------- Đồng ý ----------
  btnYes.addEventListener('click', () => {
    $('screenAsk').classList.remove('active');
    $('screenYes').classList.add('active');
    rainHearts();
  });

  function rainHearts() {
    const emojis = ['💖','💘','💝','💗','❤️','💕','🌹','✨'];
    let count = 0;
    const t = setInterval(() => {
      const h = document.createElement('div');
      h.className = 'heart';
      h.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      h.style.left = Math.random() * 100 + 'vw';
      h.style.fontSize = (1 + Math.random() * 1.6) + 'rem';
      h.style.animationDuration = (2.2 + Math.random() * 2.5) + 's';
      document.body.appendChild(h);
      h.addEventListener('animationend', () => h.remove());
      if (++count > 80) clearInterval(t);
    }, 90);
  }
})();
</script>
</body>
